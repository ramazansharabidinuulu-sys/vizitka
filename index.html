<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менин Визиткам</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Сүрөтүңүз -->
        <img src="profile.jpg" alt="Менин сүрөтүм" class="profile-img">

        <!-- Аты-жөнүңүз -->
        <h1>Шарабидин уулу Рамазан</h1>

        <!-- Кесибиңиз же багытыңыз -->
        <p class="title">Junior Web Developer / IT Student</p>

        <!-- Өзүңүз жөнүндө кыскача -->
        <p class="bio">
            Саламатсызбы! Мен веб-иштеп чыгууну өздөштүрүп жатам. Заманбап жана колдонууга ынгайлуу сайттарды жасоого кызыгам.
        </p>

        <!-- Социалдык тармактар же байланыш шилтемелери -->
        <div class="links">
            <a href="https://github.com" target="_blank" class="btn">GitHub</a>
            <a href="https://t.me" target="_blank" class="btn">Telegram</a>
            <a href="https://wa.me" target="_blank" class="btn">WhatsApp</a>
        </div>
    </div>

</body>
</html>
